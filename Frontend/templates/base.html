<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}UniCarriera{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .top-btn {
            border: 1px solid white;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            transition: 0.25s ease;
        text-decoration: none;
        }

        /* effetto bianco hover/click */
        .top-btn:hover,
        .top-btn:active {
            background-color: white;
            color: #0b6b3a;
        }
        
        :root {
            --main-green: #0b6b3a;
        }

        body {
            margin: 0;
            background-color: white;
        }

        /* navbar globale (non sidebar) */
        .topbar {
            background-color: var(--main-green);
            width: 100%;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<!-- CONTENUTO PAGINA -->
{% block content %}{% endblock %}

</body>
</html>
